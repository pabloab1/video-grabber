services:
  - type: web
    name: video-grabber
    runtime: python
    plan: free
    buildCommand: "bash build.sh"
    startCommand: "gunicorn --bind 0.0.0.0:$PORT --workers 2 --timeout 300 app:app"
    healthCheckPath: "/"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: FLASK_DEBUG
        value: "0"
